name: Deploy to GitHub Pages

# After pushing this workflow for the first time, change the
# repo's Pages source from "Deploy from a branch" to "GitHub
# Actions" (Settings → Pages → Build and deployment → Source).
# Also add a repository secret named GOOGLE_PLACES_KEY with the
# rotated Google Places API key value (Settings → Secrets and
# variables → Actions → New repository secret). The first build
# after both steps land will substitute the placeholder in
# index.html with the real key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Substitute API key
        run: |
          sed -i "s|__GOOGLE_PLACES_KEY__|${{ secrets.GOOGLE_PLACES_KEY }}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
